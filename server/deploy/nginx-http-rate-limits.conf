# Include at the Nginx http{} level only after reviewing the deployment topology.
# $binary_remote_addr is suitable only when Nginx directly receives client traffic.
limit_req_zone $binary_remote_addr zone=sravx_api_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=sravx_api_per_ip_conn:10m;
