# Enable only after apex DNS, domain filing and its certificate are verified.
server {
    listen 80;
    listen [::]:80;
    server_name sravxpet.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://sravxpet.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sravxpet.com;
    ssl_certificate /etc/letsencrypt/live/sravxpet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sravxpet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/sravx-web;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    # Website catalog reads only; don't expose the admin or transaction APIs here.
    location /api/v1/catalog/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host api.sravxpet.com;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ { return 403; }
    location ~ /\. { deny all; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /static/ { try_files $uri =404; expires 1h; }
    location /official/ { try_files $uri =404; expires 1h; }
    location / { try_files $uri $uri/ /index.html; }
}
