# Candidate public API configuration. Do not enable until the cutover gate is approved.
# The TLS certificate paths deliberately use the existing Certbot layout.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sravxpet.com;

    ssl_certificate /etc/letsencrypt/live/api.sravxpet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sravxpet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    location = /readyz {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /api/ {
        limit_req zone=sravx_api_per_ip burst=30 nodelay;
        limit_conn sravx_api_conn_per_ip 10;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.sravxpet.com;
    return 308 https://$host$request_uri;
}

